name: 虎航票價追蹤

on:
  schedule:
    # UTC，每小時 07/22/37/52 分，避開整點尖峰；不保證準時或不漏跑。
    # 分開列出只方便追查哪個排程觸發，不是獨立的可靠排程器。
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  repository_dispatch:
    types: [tigerair-watch] # 外部 scheduler 的穩定觸發入口，詳見 README。
  workflow_dispatch: # 也可以在 Actions 頁手動按 Run workflow
    inputs:
      dry:
        description: "試跑：抓價並印出本次會發的通知，但不發通知、不改任何檔案"
        type: boolean
        default: false
      summary:
        description: "強制發一次每日摘要（忽略「今天已發過」）—— 用來測試通知信有沒有寄到"
        type: boolean
        default: false

# 只給需要的權限：contents 用來 commit 更新後的頁面，issues 用來留通知留言。
permissions:
  contents: write
  issues: write

# 同一時間只跑一個，避免兩次執行同時 commit 撞在一起。
concurrency:
  group: tigerair-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取出 repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }} # 排隊後取分支最新狀態，避免重送已完成通知。

      - name: 準備 Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 記錄觸發來源
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: echo "event=$EVENT schedule=$SCHEDULE started=$(date -u +%FT%TZ)"

      - name: 驗證票價與日期費用邏輯
        run: node --test tools/*.test.mjs

      - name: 抓價、判斷、發通知、產生頁面
        id: watch
        continue-on-error: true # 寄信失敗仍必須保存票價、頁面及重試佇列。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node tools/watch.mjs ${{ inputs.dry && '--dry' || '' }} ${{ inputs.summary && '--summary' || '' }}

      - name: 有變動就 commit 回 repo
        if: ${{ !cancelled() && steps.watch.outcome != 'skipped' && steps.watch.outcome != '' && !inputs.dry }}
        run: |
          set -euo pipefail
          git config user.name  "tigerair-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html all-routes.html status.html status.json tools/state.json
          if git diff --cached --quiet; then
            echo "沒有檔案變動，跳過 commit。"
            exit 0
          fi
          git commit -m "自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 兩次執行若剛好撞在一起，先把遠端的變更接上再推
          for i in 1 2 3; do
            if git push; then
              echo "已 push。"
              exit 0
            fi
            echo "push 失敗，第 $i 次重試前先 rebase…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "push 連續失敗三次。" >&2
          exit 1

      - name: 回報抓價或通知錯誤
        if: ${{ !cancelled() && steps.watch.outcome == 'failure' }}
        run: |
          echo "::error::抓價或通知失敗。已嘗試保存成功取得的資料及待傳通知；請檢查前面的 log 與 commit 結果。"
          exit 1
